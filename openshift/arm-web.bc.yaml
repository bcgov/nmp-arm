kind: ImageStream
apiVersion: image.openshift.io/v1
metadata:
  name: arm-web
---
kind: BuildConfig
apiVersion: build.openshift.io/v1
metadata:
  name: arm-web
  labels:
    app: arm-web
spec:
  output:
    to:
      kind: ImageStreamTag
      name: 'arm-web:latest'
  resources:
    limits:
      cpu: '1'
      memory: 5Gi
    requests:
      cpu: 500m
      memory: 2Gi
  strategy:
    type: Docker
    dockerStrategy: {}
  source:
    type: Git
    git:
      uri: 'https://github.com/bcgov/nmp-arm.git'
      ref: release
    contextDir: /app/backend
  triggers:
    - type: GitHub
      github:
        secretReference:
          name: nmp-github-webhook
    - type: ConfigChange
