apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: arm-web
  name: arm-web-weasyprint
  annotations:
    image.openshift.io/triggers: '[{"from": {"kind": "ImageStreamTag", "name": "arm-weasyprint:latest",
      "namespace": "624dc1-tools"}, "fieldPath": "spec.template.spec.containers[?(@.name==\"arm-web-weasyprint\")].image",
      "paused": false}]'
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: arm-web-weasyprint
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: arm-web-weasyprint
        deploymentconfig: arm-web-weasyprint
    spec:
      containers:
      - image: image-registry.openshift-image-registry.svc:5000/624dc1-tools/arm-weasyprint@sha256:f94e753cfc8878c810f0ce3f9f791322273a4d3b8b9be9a963900ce9229422b0
        imagePullPolicy: Always
        name: arm-web-weasyprint
        ports:
        - containerPort: 5001
          protocol: TCP
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: arm-web-weasyprint
  labels:
    app: arm-web-weasyprint
spec:
  selector:
    app: arm-web-weasyprint
    deploymentconfig: arm-web-weasyprint
  ports:
    - name: 5001-tcp
      protocol: TCP
      port: 5001
      targetPort: 5001