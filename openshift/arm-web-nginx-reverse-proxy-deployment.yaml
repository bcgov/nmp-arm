apiVersion: template.openshift.io/v1
kind: Template
labels:
  template: arm-web-template
parameters:
  - name: IMAGE_TAG
    value: latest
    description: Default is latest, other valid values are test or prod
  - name: URL
    value: agri-nmp-arm-dev.apps.silver.devops.gov.bc.ca
objects:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      labels:
        app: arm-web
      name: arm-web-nginx-reverse-proxy
      annotations:
        image.openshift.io/triggers: '[{"from": {"kind": "ImageStreamTag", "name": "arm-nginx-reverse-proxy:${IMAGE_TAG}",
          "namespace": "624dc1-tools"}, "fieldPath": "spec.template.spec.containers[?(@.name==\"arm-web-nginx-reverse-proxy\")].image",
          "paused": false}]'
    spec:
      selector:
        matchLabels:
          app: arm-web-nginx-reverse-proxy
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 25%
          maxUnavailable: 25%
      template:
        metadata:
          labels:
            app: arm-web-nginx-reverse-proxy
            deploymentconfig: arm-web-nginx-reverse-proxy
        spec:
          containers:
          - image: 'image-registry.openshift-image-registry.svc:5000/624dc1-tools/arm-nginx-reverse-proxy:${IMAGE_TAG}'
            imagePullPolicy: Always
            livenessProbe:
              failureThreshold: 3
              httpGet:
                path: /
                port: 8080
                scheme: HTTP
              initialDelaySeconds: 15
              periodSeconds: 10
              successThreshold: 1
              timeoutSeconds: 5
            name: arm-web-nginx-reverse-proxy
            ports:
            - containerPort: 8080
              protocol: TCP
            readinessProbe:
              failureThreshold: 3
              httpGet:
                path: /
                port: 8080
                scheme: HTTP
              initialDelaySeconds: 15
              periodSeconds: 10
              successThreshold: 1
              timeoutSeconds: 5
            terminationMessagePath: /dev/termination-log
            volumeMounts:
            - mountPath: /static
              name: static-volume
          dnsPolicy: ClusterFirst
          restartPolicy: Always
          volumes:
          - name: static-volume
            persistentVolumeClaim:
              claimName: arm-web-static
  - kind: Service
    apiVersion: v1
    metadata:
      name: arm-web-nginx-reverse-proxy
      labels:
        app: arm-web-nginx-reverse-proxy
    spec:
      selector:
        deploymentconfig: arm-web-nginx-reverse-proxy
      ports:
        - name: 8080-tcp
          protocol: TCP
          port: 8080
          targetPort: 8080
  - kind: Route
    apiVersion: route.openshift.io/v1
    metadata:
      name: nmp-arm
      labels:
        app: arm-web-nginx-reverse-proxy
    spec:
      host: ${URL}
      to:
        kind: Service
        name: arm-web-nginx-reverse-proxy
      port:
        targetPort: 8080-tcp
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
